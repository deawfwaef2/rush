<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CHARGE!</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{--ink:#efe4cc;--dim:#a99c80;--brass:#c9a45a;--brass2:#8a6a2e;--red:#b2321f;--panel:#1b1812;--line:#5d4e36;--olive:#4d5a34}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0b09;font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;color:var(--ink);touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui *{pointer-events:auto}
.hide{display:none!important}
.stencil{font-family:Impact,"Arial Narrow Bold","Arial Black","Heiti SC","Microsoft YaHei",sans-serif;letter-spacing:.06em}
b{font-weight:700}
/* ---------- top bar ---------- */
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:stretch;gap:8px;padding:10px 12px;pointer-events:none;background:linear-gradient(#000a,#0000)}
#top>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:8px;background:linear-gradient(#2b261d,#15120d);border:1px solid var(--line);border-radius:6px;padding:4px 12px 4px 6px;box-shadow:inset 0 1px 0 #ffffff14,0 3px 8px #0008;cursor:pointer;min-height:46px}
.chip .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#4a4030,#1a160f);border:1px solid var(--brass2);flex:none}
.chip .ic svg{width:24px;height:24px}
.chip .lb{font-size:10px;letter-spacing:.16em;color:var(--dim);display:block;line-height:1.1;text-transform:uppercase}
.chip .vv{display:flex;flex-direction:column;justify-content:center}
.chip .vv>b,.chip .vv>span:not(.lb){font-size:19px;line-height:1.1}
.chip small{font-size:12px;color:var(--brass)}
.mbar{width:92px;height:7px;border-radius:4px;background:#0008;border:1px solid #0008;overflow:hidden;margin-top:3px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#8a2a1a,#c9a45a 50%,#8fb050);background-size:92px 100%;transition:width .5s}
.tbar{width:110px;height:5px;border-radius:3px;background:#0008;overflow:hidden;margin-top:3px}
.tbar i{display:block;height:100%;background:var(--brass)}
.ibtn{width:46px;height:46px;display:grid;place-items:center;background:linear-gradient(#2f291f,#15120d);border:1px solid var(--line);border-radius:6px;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff14,0 3px 8px #0008}
.ibtn:active,.chip:active{transform:translateY(2px)}
.ibtn svg{width:26px;height:26px}
.grow{flex:1}
#bAdW{display:flex;align-items:center;gap:8px;cursor:pointer;background:linear-gradient(#4a3a18,#231a0a);border:1px solid var(--brass);border-radius:6px;padding:3px 10px 3px 4px;box-shadow:0 0 14px #c9a45a44}
#bAdW .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#1a1409;border:1px solid var(--brass)}
#bAdW .ic svg{width:24px;height:24px}
#bAdW .lb2{font-size:12px;line-height:1.2}
#bAdW .lb2 b{font-size:14px;color:#f3d890}
#bAdW.used{filter:grayscale(1);opacity:.5;box-shadow:none}
#bDev{background:#3a1010;border-color:#a33;color:#fbb;font-size:11px;width:auto;padding:0 10px;font-family:monospace}
/* ---------- buttons ---------- */
.btn{cursor:pointer;border:none;color:#1b140c;background:linear-gradient(#f0dfb2,#b99a5d);border-radius:4px;padding:10px 22px;font-size:20px;box-shadow:inset 0 1px 0 #fff8,0 3px 0 #5e4a2a,0 6px 14px #0008;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 #5e4a2a}
.btn.red{background:linear-gradient(#d24a33,#7e1d12);color:#f6e9d2;box-shadow:inset 0 1px 0 #fff4,0 4px 0 #3c0c06,0 8px 20px #000a}
.btn.dim{background:linear-gradient(#5b5140,#3a3328);color:#bfb39a;box-shadow:0 3px 0 #1c1813}
.btn.sm{font-size:15px;padding:7px 14px}
#charge{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:36px;padding:10px 54px 12px;letter-spacing:.14em;border:2px solid #f0b08a55}
#charge:active{transform:translateX(-50%) translateY(4px)}
#charge.refuse{background:linear-gradient(#555,#333);color:#999}
/* ---------- menu ---------- */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8vh;pointer-events:none}
#menu>*{pointer-events:auto}
#logo{position:absolute;top:13vh;left:0;right:0;text-align:center;pointer-events:none}
#logo h1{font-size:min(17vw,128px);line-height:.9;color:#eadbb8;text-shadow:0 5px 0 #000,0 0 50px #000c;letter-spacing:.16em}
#logo div{font-size:15px;opacity:.8;letter-spacing:.5em;margin-top:8px;text-shadow:0 1px 3px #000}
#play{font-size:26px;padding:12px 64px;letter-spacing:.25em}
#frontinfo{margin-top:12px;font-size:14px;opacity:.85;letter-spacing:.18em;text-shadow:0 1px 3px #000}
#menuHint{margin-top:6px;font-size:12px;opacity:.55;letter-spacing:.1em}
/* ---------- panels ---------- */
.panel{position:absolute;background:linear-gradient(#26211acc,#141109ee);border:1px solid var(--line);border-radius:8px;box-shadow:inset 0 1px 0 #ffffff12,0 10px 30px #000b;padding:10px 12px;backdrop-filter:blur(3px)}
.panel:before{content:"";position:absolute;inset:3px;border:1px dashed #ffffff10;border-radius:6px;pointer-events:none}
.ph{font-size:12px;letter-spacing:.3em;color:var(--brass);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase}
.ph span:last-child{letter-spacing:.05em;color:var(--dim);text-transform:none;font-size:12px}
.rep{margin:10px 0 6px;text-align:left;font-size:13px}.rep table{width:100%;border-collapse:collapse}.rep td{padding:3px 6px;border-bottom:1px solid #ffffff14}.rep td:last-child{text-align:right;font-family:Impact,sans-serif;font-size:17px}.rep td small{font-family:Georgia;font-size:10px;opacity:.7}.rep .red{color:#e87a5a}.rep .gold{color:#f0c870}.rep .rem{margin-top:8px;padding:7px 9px;background:#0005;border-left:3px solid var(--brass);font-style:italic;line-height:1.4}
.fails{grid-column:1/-1;width:100%;margin-top:8px;font-size:11px;border-top:1px solid #ffffff18;padding-top:6px}.fails .ft{color:#e87a5a;letter-spacing:.15em;margin-bottom:3px}.fails .fr{padding:2px 0;color:var(--ink)}.fails .fr i{color:var(--dim);margin:0 3px 0 1px}.fails .fr span{color:#e8a080;margin-left:4px}
.ov .card{max-height:96vh;overflow:auto}
#left{left:12px;top:72px;width:270px;max-height:calc(100vh - 160px);overflow:auto}
#waveTabs{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
#waveTabs button{flex:1;min-width:44px;height:38px;border-radius:5px;border:1px solid var(--line);background:linear-gradient(#3a3226,#1f1a13);color:var(--ink);font-family:Impact,sans-serif;font-size:15px;letter-spacing:.06em;cursor:pointer;line-height:1;position:relative}
#waveTabs button small{display:block;font-family:Georgia;font-size:10px;color:var(--dim);margin-top:2px}
#waveTabs button.on{border-color:var(--brass);background:linear-gradient(#6a5634,#2a2215);box-shadow:0 0 0 1px #c9a45a66,inset 0 1px 0 #fff3}
#waveTabs button.add{flex:0 0 40px;font-size:22px;color:var(--brass)}
#waveTabs button .x{position:absolute;right:-5px;top:-6px;width:17px;height:17px;border-radius:50%;background:#7a2616;color:#fff;font:11px/17px Georgia;display:none}
#waveTabs button.on .x{display:block}
.wsub{font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;text-align:center}
#vetRow,#formRow,#delayRow{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:13px}
#vetRow .lb,#formRow .lb,#delayRow .lb{flex:0 0 74px;color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.sm1{width:34px;height:34px;border-radius:50%;border:1px solid var(--brass);background:radial-gradient(circle at 40% 30%,#6a5a3a,#2a2217);color:#f3e2b8;font-size:20px;line-height:1;cursor:pointer}
.sm1:active{transform:translateY(2px)}
#vetRow b,#delayRow b{flex:1;text-align:center;font-family:Impact,sans-serif;font-size:22px;color:#f0c870}
#formRow button{flex:1;height:40px;border-radius:5px;border:1px solid var(--line);background:linear-gradient(#3a3226,#1f1a13);color:var(--ink);cursor:pointer;font-size:10px;font-family:Georgia;padding:2px}
#formRow button svg{display:block;margin:0 auto 1px}
#formRow button.on{border-color:var(--brass);background:linear-gradient(#6a5634,#2a2215)}
#warn{margin-top:6px;font-size:12px;line-height:1.35}
#warn div{padding:4px 6px;border-radius:4px;margin-top:3px;background:#5a1a0e99;border-left:3px solid #e0603a;color:#ffd9c0}
#warn div.ok{background:#2a3a1a99;border-left-color:#9ac060;color:#dfeec8}
#right{right:12px;top:72px;width:270px;max-height:calc(100vh - 170px);overflow:auto}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 6px}
.rb{width:52px;height:52px;border-radius:50%;border:1px solid var(--brass);background:radial-gradient(circle at 40% 30%,#6a5a3a,#2a2217);color:#f3e2b8;font-size:30px;line-height:1;cursor:pointer;box-shadow:inset 0 2px 0 #ffffff22,0 3px 0 #000;font-family:Georgia}
.rb:active{transform:translateY(2px);box-shadow:none}
.bigN{font-size:52px;text-align:center;line-height:1;flex:1;color:#f6ead0;text-shadow:0 2px 0 #000}
.bigN small{display:block;font-size:11px;letter-spacing:.25em;color:var(--dim);font-family:Georgia;margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:2px 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--brass) var(--p,0%),#0009 var(--p,0%));border:1px solid #000}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;margin-top:-9px;background:radial-gradient(circle at 40% 30%,#f3e2b8,#8a6a2e);border:2px solid #1a140c;box-shadow:0 2px 4px #000}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#0009}
input[type=range]::-moz-range-progress{height:8px;background:var(--brass);border-radius:4px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#c9a45a;border:2px solid #1a140c}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:4px}
.presets button{height:34px;border-radius:4px;border:1px solid var(--line);background:linear-gradient(#3a3226,#1f1a13);color:var(--ink);font-family:inherit;font-size:14px;cursor:pointer;line-height:1}
.presets button small{display:block;font-size:9px;color:var(--dim);letter-spacing:.05em}
.presets button:active{transform:translateY(2px)}
#sendInfo{margin-top:8px;font-size:13px;line-height:1.6;border-top:1px solid #ffffff12;padding-top:6px}
#sendInfo div{display:flex;justify-content:space-between}
#sendInfo span{color:var(--dim)}
.pdesc{font-size:11px;color:var(--dim);font-style:italic;margin-top:6px;line-height:1.35}
.badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 35% 30%,#5a2a1e,#200c07);border:1px solid #a0442c;box-shadow:inset 0 1px 0 #ffffff22}
.badge.g{background:radial-gradient(circle at 35% 30%,#4f5a34,#161a0c);border-color:#8fa060}
.badge.b{background:radial-gradient(circle at 35% 30%,#5a4a2a,#1a140a);border-color:var(--brass)}
.badge svg{width:28px;height:28px}
.hz{display:grid;grid-template-columns:40px 1fr auto;grid-template-rows:auto auto auto;column-gap:9px;align-items:center;padding:7px 2px;border-bottom:1px solid #ffffff10;cursor:pointer}
.hz:hover{background:#ffffff08}
.hz .badge{grid-row:1/4}
.hz .nm{font-size:15px}
.hz .val{font-size:22px;font-family:Impact,sans-serif;letter-spacing:.04em}
.hz .bar{grid-column:2/4;height:5px;background:#0008;border-radius:3px;overflow:hidden;margin:3px 0}
.hz .bar i{display:block;height:100%;background:linear-gradient(90deg,#c9862f,#c8432f);transition:width .5s}
.hz .ds{grid-column:2/4;font-size:11px;color:var(--dim);font-style:italic;line-height:1.3}
.hz .inf{font-size:10px;color:var(--brass);font-style:normal;margin-left:4px;opacity:.8}
.hz.fx{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
#reward{margin-top:8px;padding:8px;border-radius:6px;background:linear-gradient(#3a2f16,#20190b);border:1px solid var(--brass2);display:flex;align-items:center;gap:10px}
#reward .t{font-size:11px;color:var(--dim);letter-spacing:.08em}
#reward .v{font-size:20px;color:#f3d890}
#fort{margin-top:8px;background:repeating-linear-gradient(45deg,#7e1d12,#7e1d12 10px,#5e150c 10px,#5e150c 20px);color:#f6e9d2;text-align:center;padding:6px;font-size:13px;letter-spacing:.12em;border-radius:4px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.6}}
#supWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:92px;display:flex;flex-direction:column;align-items:center;gap:4px}
#supT{font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;text-shadow:0 1px 2px #000}
#supports{display:flex;gap:10px}
.sup .sm0{width:30px;height:30px;border-radius:50%;border:1px solid var(--brass);background:#1a140c;color:#f3e2b8;font-size:18px;line-height:1;cursor:pointer;flex:none}
.sup .sm0:active{transform:scale(.9)}
.pips{display:flex;gap:3px;margin-top:3px}.pips em{width:9px;height:9px;border-radius:50%;border:1px solid #8fa060;background:#0006}.pips em.u{background:#f3d890;border-color:#f3d890;box-shadow:0 0 6px #f3d890}
.sup .n{left:auto!important;right:34px;top:-8px!important;font-size:13px!important;min-width:24px!important;height:24px!important;background:#c9a45a!important;color:#1a140c!important}
.sup.on .n{animation:pop .3s}@keyframes pop{50%{transform:scale(1.4)}}
.sup{position:relative;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:30px;cursor:pointer;background:linear-gradient(#2e281e,#15120d);border:1px solid var(--line);box-shadow:0 3px 8px #0009;max-width:210px}
.sup:active{transform:translateY(2px)}
.sup .tx{display:flex;flex-direction:column;line-height:1.15}.sup .tx b{font-size:14px}.sup .tx i{font-size:10.5px;color:var(--dim)}
.sup .n{position:absolute;left:30px;top:-5px;background:var(--red);color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center;font-family:sans-serif;border:1px solid #000;padding:0 4px}
.sup .q{position:absolute;right:-4px;top:-6px;width:18px;height:18px;border-radius:50%;background:#1a140c;border:1px solid var(--brass);color:var(--brass);font-size:11px;display:grid;place-items:center;font-family:Georgia}
.sup.off{opacity:.4;filter:grayscale(1)}
.sup.on{border-color:#f3d890;box-shadow:0 0 16px #c9a45a88}
#advisor{position:absolute;left:50%;transform:translateX(-50%);top:70px;max-width:44vw;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#15120dee,#221d15ee);border:1px solid var(--line);border-radius:40px;padding:4px 18px 4px 4px;box-shadow:0 6px 18px #0009}
#advisor .face{width:44px;height:44px;border-radius:50%;flex:none;overflow:hidden;border:1px solid var(--brass2)}
#advisor .who{font-size:10px;letter-spacing:.2em;color:var(--brass);text-transform:uppercase}
#advisor .say{font-style:italic;font-size:15px}
/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#0007,#000d);text-align:center;padding:20px;overflow:auto}
.card{background:linear-gradient(#ebdcb6,#c8b082);color:#241a0e;padding:22px 30px;border-radius:3px;max-width:600px;box-shadow:0 12px 40px #000;position:relative}
.card:before{content:"";position:absolute;inset:6px;border:1px solid #6b5a3e66;pointer-events:none}
.card svg{filter:brightness(.4) contrast(1.4)}
.card .badge svg{filter:none}
.card h2{font-size:30px;letter-spacing:.1em;margin-bottom:6px}
.card p{font-size:16px;line-height:1.5;margin:10px 0;font-style:italic}
.card .date{font-size:12px;letter-spacing:.3em;opacity:.7}
.card table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0;text-align:left}
.card td{padding:5px 4px;border-bottom:1px solid #6b5a3e44}
.card td:last-child{text-align:right;font-weight:bold}
.card .mech{text-align:left;font-size:14px;line-height:1.55;font-style:normal}
.card .mech li{margin:4px 0 4px 18px}
.stats{display:flex;gap:18px;justify-content:center;margin:12px 0;font-size:20px}
#bigtxt{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:min(13vw,104px);color:#f2e6c8;text-shadow:0 6px 0 #000,0 0 50px #000;pointer-events:none;letter-spacing:.1em;opacity:0;transition:opacity .3s}
#bigtxt.show{opacity:1}
#bigtxt small{display:block;font-size:20px;letter-spacing:.3em;margin-top:6px;opacity:.9;font-family:Georgia}
#hud{position:absolute;left:50%;transform:translateX(-50%);top:72px;display:flex;gap:18px;font-size:22px;background:#0008;padding:4px 16px;border-radius:20px}
#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);background:#14110dee;border:1px solid var(--brass2);padding:8px 18px;border-radius:4px;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none!important}
#toast.show{opacity:1}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:10px 0;font-size:17px}
#adbanner{position:absolute;right:12px;bottom:12px;width:300px;height:250px;display:none}
/* tutorial */
#tut{position:absolute;inset:0;z-index:5}
#tutHole{position:absolute;border-radius:8px;box-shadow:0 0 0 9999px #000b;border:2px solid #f3d890;transition:all .35s;pointer-events:none!important}
#tutBox{position:absolute;max-width:340px;background:linear-gradient(#ebdcb6,#c8b082);color:#241a0e;padding:14px 16px;border-radius:4px;box-shadow:0 10px 30px #000;font-size:15px;line-height:1.45;transition:all .35s}
#tutBox h3{font-size:13px;letter-spacing:.25em;color:#7e1d12;margin-bottom:4px}
#tutBox .nx{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.9}
.ftxt{position:absolute;transform:translate(-50%,0);text-shadow:0 3px 0 #000,0 0 20px #000;animation:ft 1.4s ease-out forwards;pointer-events:none!important;z-index:4}
@keyframes ft{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}30%{transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-60px)}}
.edgeL,.edgeR{position:absolute;top:0;bottom:0;width:5%;pointer-events:none!important;opacity:0;transition:opacity .3s}
.edgeL{left:0;background:linear-gradient(90deg,#f3d89022,transparent)}.edgeR{right:0;background:linear-gradient(-90deg,#f3d89022,transparent)}
.edgeL.on,.edgeR.on{opacity:1}
#vban{position:absolute;left:0;right:0;top:22%;display:flex;justify-content:center;pointer-events:none!important;z-index:4}
#vban .rib{position:relative;text-align:center;padding:14px 80px 16px;background:linear-gradient(90deg,transparent,#7e1d12 12%,#a8321f 50%,#7e1d12 88%,transparent);animation:ribIn .6s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 10px 40px #000a}
#vban .rib:before,#vban .rib:after{content:"";position:absolute;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,#f3d890,transparent)}
#vban .rib:before{top:5px}#vban .rib:after{bottom:5px}
#vban .medal{position:absolute;left:50%;top:-38px;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2c0,#c9a45a 45%,#6a4a18);border:3px solid #3a2a0a;color:#5a3a0a;font-size:32px;line-height:54px;box-shadow:0 0 30px #f3d890;animation:spinIn .9s ease-out both}
#vban .w{font-size:min(12vw,96px);color:#fff4d8;text-shadow:0 4px 0 #3a0a04,0 0 30px #f3a06080;letter-spacing:.16em;line-height:1}
#vban .p{font-size:22px;color:#f3d890;letter-spacing:.3em;margin-top:2px}
#vban .s{font-size:14px;color:#efe4cc;letter-spacing:.35em;opacity:.85;font-style:italic}
#vban.out{animation:ribOut .6s forwards}

/* ---------------- Level generation ---------------- */
function levelDef(i){
  const ch = Math.floor(i/8), k=i%8, fort = k===7;
  const d = i;                    // difficulty index
  let L = {
    i, ch, fort,
    gr: Math.round((5 + d*1.9 + ch*2) * (fort?1.7:1)),
    mg: Math.min(6, (i<1?0:1) + Math.floor(d/5) + (fort?2:0)),
    rf: Math.min(10, 1 + Math.floor(d/3) + (fort?2:0)),
    mn: i<2 ? 0 : Math.min(14, 1 + Math.floor(d/2.5) + (fort?3:0)),
    sh: ch>=1 ? Math.min(5, 1+Math.floor((d-8)/5) + (fort?1:0)) : 0,
    wr: ch>=1 ? 1 + (fort?1:0) + (ch>=3?1:0) : 0,
    gs: ch>=3 ? Math.min(4, 1+Math.floor((d-24)/3)+(fort?1:0)) : 0,
    reward: fort ? 8 + ch*2 : 2 + Math.floor(ch/1.5),
  };
  if(i===0){L.gr=4;L.mg=0;L.rf=1;}
  return L;
}

  if(n>0){ n=Math.min(n,7); S.lastGain=dailyMen()*n; S.reserve+=dailyMen()*n; S.day+=n; S.lastPay+=Math.floor((now-S.lastPay)/DAY_MS)*DAY_MS; refreshSupports(true); save(); return n;}
  refreshSupports(false); return 0;
}

function giveDay(){ S.lastGain=dailyMen(); S.reserve+=dailyMen(); S.lastPay=Date.now(); S.day+=1; refreshSupports(true); save(); }

/* BGM: Kevin MacLeod tracks (CC BY 4.0, see CREDITS.md) with crossfade. Falls back to procedural pad if files are missing. */
const BGM={el:{},cur:null,ok:false,paused:false,
 init(){ if(this.inited)return; this.inited=1;
   for(const [k,f] of [["calm","audio/calm.mp3"],["charge","audio/charge.mp3"]]){ const a=new Audio(f); a.loop=true; a.preload="auto"; a.volume=0; a.onerror=()=>{ if(!this.ok&&!this.fell){this.fell=1;AU.startMusic();} }; a.oncanplay=()=>{this.ok=true;}; this.el[k]=a; }
   this.play(mode==="charge"||mode==="melee"?"charge":"calm"); },
 target(k){ return S.mus ? (k==="charge"?0.55:0.4) : 0; },
 play(k){ if(!this.inited)return; if(this.cur===k)return; this.cur=k; const a=this.el[k]; if(a){ if(k==="charge")a.currentTime=0; a.play().catch(()=>{}); } },
 setVol(){},
 step(dt){ if(!this.inited||this.paused)return; for(const k in this.el){ const a=this.el[k]; const tv=k===this.cur?this.target(k):0; a.volume=Math.max(0,Math.min(1,a.volume+(tv-a.volume)*Math.min(1,dt*1.2))); if(tv===0&&a.volume<0.01&&!a.paused&&k!==this.cur)a.pause(); } },
 pauseAll(m){ this.paused=m; for(const k in this.el){ const a=this.el[k]; if(m)a.pause(); else if(k===this.cur)a.play().catch(()=>{}); } }
};
/* ============ REAL RECORDED SFX (CC0, freesound.org; audio/sfx.js) — replaces synth; synth kept only as fallback ============ */
const SFX={buf:{},inited:false,loops:{},last:{},
 init(){ if(this.inited||!AU.ctx||!window.SFX_DATA)return; this.inited=true;
   for(const k in SFX_DATA){ const bin=atob(SFX_DATA[k]); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
     AU.ctx.decodeAudioData(u.buffer).then(b=>{this.buf[k]=b; if(k==="amb_big"||k==="wind"||k==="rain"||k==="booms_far")this.updLoops();}).catch(()=>{}); } },
 has(k){return !!this.buf[k];},
 play(k,vol=1,o={}){ const b=this.buf[k]; if(!b||!AU.ctx)return false; const now=AU.now();
   if(o.gap){ if(this.last[k]&&now-this.last[k]<o.gap)return true; this.last[k]=now; }
   const src=AU.ctx.createBufferSource(); src.buffer=b; src.playbackRate.value=(o.rate||1)*(o.fixed?1:(0.93+Math.random()*0.14));
   const g=AU.ctx.createGain(); g.gain.value=vol; let node=g;
   if(AU.ctx.createStereoPanner){ const pn=AU.ctx.createStereoPanner(); pn.pan.value=o.pan!=null?o.pan:(Math.random()-0.5)*0.6; g.connect(pn); node=pn; }
   if(o.lp){ const f=AU.ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=o.lp; src.connect(f); f.connect(g);} else src.connect(g);
   node.connect(AU.master); src.start(now+(o.delay||0), o.off||0); if(o.dur)src.stop(now+(o.delay||0)+o.dur); return true; },
 loop(k,vol){ const b=this.buf[k]; if(!b||!AU.ctx)return; let L=this.loops[k];
   if(!L){ const src=AU.ctx.createBufferSource(); src.buffer=b; src.loop=true; const g=AU.ctx.createGain(); g.gain.value=0; src.connect(g); g.connect(AU.master); src.start(0,Math.random()*b.duration*0.5); L=this.loops[k]={src,g}; }
   L.g.gain.setTargetAtTime(vol,AU.now(),1.2); },
 updLoops(){ if(!AU.ctx)return; const busy=(mode==="charge"||mode==="melee"||mode==="barrage"); const ch=lvl?lvl.ch:0;
   this.loop("amb_big", busy?0.5:0.22); this.loop("booms_far", busy?0.15:0.35); this.loop("wind", ch===2?0.45:0.14); this.loop("rain", ch===1?0.5:0);
   this.loop("rifle_far", busy?0.25:0.12); this.loop("amb_civil", busy?0.35:0); }

// route AU calls to real recordings (fallback to synth when not decoded yet)
(function(){ const o={}; for(const k of ["shot","mg","boom","whistle","bugle","cheer","clang","thud","crash","fanfare","incoming"]) o[k]=AU[k];
  AU.shot=function(v=0.35){ if(!SFX.play(v>=0.2?"rifle":"rifle_rev",Math.min(1.2,v*2.4),{gap:0.05,lp:v<0.2?1800:null}))o.shot.call(AU,v); };
  AU.mg=function(n,v=0.25){ if(!SFX.play(Math.random()<0.6?"mg":"mg_far",Math.min(1,v*3),{gap:0.9}))o.mg.call(AU,n,v); };
  AU.boom=function(v=0.9){ if(!SFX.play(Math.random()<0.5?"boom":"arty",Math.min(1.4,v*1.5),{gap:0.08,off:0}))o.boom.call(AU,v); };
  AU.incoming=function(d){ if(!SFX.play(Math.random()<0.5?"inc1":"inc2",0.55,{gap:0.25}))o.incoming&&o.incoming.call(AU,d); };
  AU.whistle=function(){ if(!SFX.play("whistle",0.9,{fixed:1,dur:2.2}))o.whistle.call(AU); };
  AU.bugle=function(){ if(!SFX.play("bugle",0.7,{fixed:1,dur:6}))o.bugle.call(AU); };
  AU.cheer=function(){ const k=(mode==="charge"||mode==="melee")?"charge":"cheer"; if(!SFX.play(k,0.8,{gap:2.5}))o.cheer.call(AU); };
  AU.clang=function(){ if(!SFX.play(["clash1","clash2","punch"][Math.floor(Math.random()*3)],0.5,{gap:0.07,dur:1.2}))o.clang.call(AU); };
  AU.thud=function(){ if(!SFX.play("mud",0.35,{gap:0.18,dur:0.6,off:Math.random()*2}))o.thud.call(AU); };
  AU.crash=function(){ if(!SFX.play("arty",1.1))o.crash.call(AU); };
  AU.fanfare=function(){ if(!SFX.play("cheer",0.9,{fixed:1}))o.fanfare.call(AU); SFX.play("bugle",0.5,{fixed:1,delay:0.6,dur:7}); };
  AU.scream=function(){ SFX.play(Math.random()<0.5?"scream1":"scream2",0.35,{gap:0.8,lp:3000}); };
  AU.fall=function(){ SFX.play("fall",0.35,{gap:0.12}); };
})();

function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000;};}

function vnoise(x){const i=Math.floor(x),f=x-i;const a=hash(i),b=hash(i+1);const t=f*f*(3-2*f);return a+(b-a)*t;}

/* ---- background layers (parallax) ---- */
function drawSky(){
  const hz=horizon();
  const g=cx.createLinearGradient(0,0,0,hz+H*0.1);g.addColorStop(0,pal.sky[0]);g.addColorStop(0.6,pal.sky[1]);g.addColorStop(1,pal.sky[2]);
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // sun
  const sx=W*0.72-cam.x*0.002%W, sy=hz-H*0.18;
  const sg=cx.createRadialGradient(sx,sy,0,sx,sy,H*0.45);sg.addColorStop(0,pal.sun);sg.addColorStop(0.08,pal.sun+"cc");sg.addColorStop(0.3,"rgba(255,240,200,0.12)");sg.addColorStop(1,"rgba(255,240,200,0)");
  cx.fillStyle=sg;cx.fillRect(0,0,W,H);
  // cloud streaks
  cx.globalAlpha=0.18;cx.fillStyle="#fff";
  for(let i=0;i<7;i++){const px=((i*397-cam.x*0.03-time*4)%(W+600)+W+600)%(W+600)-300;const py=hz*(0.15+0.12*(i%4));
    cx.beginPath();cx.ellipse(px,py,180+i*30,10+i%3*6,0,0,7);cx.fill();}

}
function ridge(par,base,amp,freq,col,seed,rough){
  const hz=horizon();
  const rg=cx.createLinearGradient(0,hz+base-amp,0,hz+base+H*0.05);rg.addColorStop(0,shade(col,pal.sky[2],0.35));rg.addColorStop(1,col);cx.fillStyle=rg;cx.beginPath();cx.moveTo(0,H);
  const off=cam.x*par*scaleZ(0.0)/ (scaleZ(0)||1);
  for(let x=0;x<=W+8;x+=8){const wx=(x+cam.x*par)/freq;
    let y=hz+base - amp*(vnoise(wx+seed)*0.7+vnoise(wx*3.1+seed)*0.25*rough+vnoise(wx*9+seed)*0.08*rough);
    cx.lineTo(x,y);}

function farTrees(par,base,col,seed,density,hgt){ // skeletal trees / poles silhouettes

  for(let k=start;k<start+Math.ceil((W+400)/step);k++){
    const r=hash(k*7+seed); if(r<0.1)continue;
    const x=k*step-cam.x*par+hash(k+seed)*step*0.5; const y=hz+base;

    cx.lineWidth=Math.max(1,h*0.05);cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+hash(k*5)*h*0.1,y-h);cx.stroke();

/* TRENCH v2 — one continuous fire trench with bays & traverses; men wait INSIDE (see drawManInTrench). Flat fills = fast. */
const TR_D=34, TR_W=30;

  // hole
  cx.fillStyle="#120c07";cx.beginPath();S_.forEach((q,i)=>{const p=Q(lx(q),q.z,0);i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]);});for(let i=n;i>=0;i--){const p=Q(rx(S_[i]),S_[i].z,0);cx.lineTo(p[0],p[1]);}cx.fill();
  for(let i=0;i<n;i++){const A=S_[i],B=S_[i+1];
    // floor + duckboards (A-frames)
    const a1=Q(lx(A)+4,A.z,-D),a2=Q(rx(A)-4,A.z,-D),b1=Q(lx(B)+4,B.z,-D),b2=Q(rx(B)-4,B.z,-D);
    cx.fillStyle="#2b2016";cx.beginPath();cx.moveTo(a1[0],a1[1]);cx.lineTo(b1[0],b1[1]);cx.lineTo(b2[0],b2[1]);cx.lineTo(a2[0],a2[1]);cx.fill();
    cx.fillStyle="#6a5236"; const m1=Q(A.x-8,A.z,-D+1),m2=Q(A.x+8,A.z,-D+1),m3=Q(B.x+8,B.z,-D+1),m4=Q(B.x-8,B.z,-D+1);
    cx.beginPath();cx.moveTo(m1[0],m1[1]);cx.lineTo(m2[0],m2[1]);cx.lineTo(m3[0],m3[1]);cx.lineTo(m4[0],m4[1]);cx.fill();
    cx.strokeStyle="#3a2a18";cx.lineWidth=Math.max(0.6,1.2*m1[2]);for(let k=0;k<4;k++){const t=k/4;cx.beginPath();cx.moveTo(m1[0]+(m4[0]-m1[0])*t,m1[1]+(m4[1]-m1[1])*t);cx.lineTo(m2[0]+(m3[0]-m2[0])*t,m2[1]+(m3[1]-m2[1])*t);cx.stroke();}

      cx.fillStyle= sd===side ? "#5e4630" : "#4a3824"; cx.beginPath();cx.moveTo(t1[0],t1[1]);cx.lineTo(t2[0],t2[1]);cx.lineTo(c2[0],c2[1]);cx.lineTo(c1[0],c1[1]);cx.fill();
      cx.strokeStyle= sd===side ? "rgba(25,16,8,0.6)" : "rgba(25,16,8,0.35)"; cx.lineWidth=Math.max(0.6,1*t1[2]);
      for(let k=1;k<(sd===side?6:4);k++){const f=k/(sd===side?6:4);cx.beginPath();cx.moveTo(t1[0]+(c1[0]-t1[0])*f,t1[1]+(c1[1]-t1[1])*f);cx.lineTo(t2[0]+(c2[0]-t2[0])*f,t2[1]+(c2[1]-t2[1])*f);cx.stroke();}
      cx.fillStyle="#2a1c0e"; if(i%2===0)cx.fillRect(t1[0]-1.6*t1[2],t1[1]-5*t1[2],3.2*t1[2],c1[1]-t1[1]+5*t1[2]);

      cx.fillStyle="#070403";cx.fillRect(m[0]-w/2,m[1],w,h);cx.fillStyle="#4a3420";cx.fillRect(m[0]-w/2-2*m[2],m[1]-3*m[2],w+4*m[2],3*m[2]);

    if(r<-0.75){ cx.fillStyle="#2a2016";cx.fillRect(sx-1.5*sc,sy-34*sc,3*sc,30*sc);cx.fillRect(sx-1.5*sc,sy-34*sc,side*7*sc,3*sc); }
  }

    cx.strokeStyle="#241a10";cx.lineWidth=Math.max(1,1.8*sc);cx.beginPath();cx.moveTo(sx,sy);cx.lineTo(sx+2*sc,sy-24*sc);cx.moveTo(sx+18*sc,sy);cx.lineTo(sx+16*sc,sy-22*sc);cx.stroke();
    cx.strokeStyle="rgba(40,30,20,0.75)";cx.lineWidth=Math.max(0.6,0.8*sc);cx.beginPath();
    for(let j=0;j<=24;j++){const a=j*0.8;cx.lineTo(sx-6*sc+j*1.3*sc+Math.cos(a)*5*sc,sy-12*sc+Math.sin(a)*8*sc);}cx.stroke();}

// traverse blocks (earth + sandbags across the trench every other bay) — depth-sorted so they hide men behind them
function traverseEnts(ents,x,side){ for(let k=1;k<12;k+=2){ const z=k/12; ents.push({z:z+0.001,d:()=>{

/* ---------- Advisor: Monte-Carlo estimate, words only ---------- */
function simulateQuick(n,vets,c,runs=120){
  if(n<=0)return 0; let wins=0;
  for(let r=0;r<runs;r++){
    let alive=n, v=Math.min(vets,n);
    const tCross=SEGL()/150*(1+c.wr*0.18)*(lvl.ch===2?1.15:1);
    const pDie=1-Math.exp(-(c.mg*0.028+c.rf*0.0065+c.sh*0.006+c.gs*0.008)*(tCross*1500/SEGL())*(used.smk?Math.max(0.35,1-0.25*used.smk):1)*(used.snp?Math.max(0.6,1-0.12*used.snp):1)/mf());
    let d=0;for(let i=0;i<alive;i++)if(Math.random()<pDie)d++;
    alive-=d; v=Math.round(v*(alive/n));
    d=0;for(let i=0;i<Math.round(c.mn);i++){if(alive>0)d+=1+Math.floor(Math.random()*2.2);} alive=Math.max(0,alive-d);
    v=Math.min(v,alive);
    let e=Math.round(c.gr);
    while(alive>0&&e>0){ let k=0;for(let i=0;i<alive;i++)if(Math.random()<(i<v?0.62:0.42)*mf())k++; let kk=0;for(let i=0;i<e;i++)if(Math.random()<0.4)kk++; e-=k; alive-=kk; v=Math.min(v,alive);}
    if(e<=0&&alive>0)wins++;
  }
  return wins/runs;
}

  startCharge.barraged=0; ["left","supWrap","charge","bBack","right"].forEach(id=>$(id).classList.remove("hide"));
  if(sendN<=0){toast(L_().noTroops);return;}
  moraleTick(); if(S.morale<=2){ big(S.lang==="zh"?"士兵拒绝冲锋":"THE MEN REFUSE", S.lang==="zh"?"士气耗尽。等待士气恢复。":"Morale is gone. Give them time.",2600); return; }
  AU.init();
  mode="charge"; $("plan").classList.add("hide");
  // finalize soldiers: ensure count = sendN (materialize remaining queue instantly)
  syncMen(); while(pushList.length)pushOne();
  men=men.filter(m=>m.sent);
  const vetsSent=totV(); S.lastWaves=waves.map(w=>({r:w.r,v:w.v,f:w.f,d:w.d}));
  S.reserve-=sendN; S.vets-=vetsSent; save(); updTop();
  const bx=trenchX(S.lvl);
  let acc=0; const wStart=waves.map((w,i)=>{ if(i>0) acc+=w.d+1.2; return acc; });
  men.forEach((m,i)=>{m.arriving=false;m.x=m.tx;m.state="crouch";const wf=waves[m.wave||0]; m.form=wf?wf.f:1; m.delay=0.9+wStart[m.wave||0]+Math.random()*(m.form===0?1.6:m.form===1?0.8:0.45);m.mor=55+S.morale*0.4+(m.vet?30:0)+Math.random()*25;m.speed=(135+Math.random()*35)*(lvl.ch===2?0.87:1)*(0.85+0.15*mf()/1.0);});
  battle={t:0,sent:sendN,dead:0,reached:0,nodes:[0.3,0.6,0.86].map(f=>({x:bx+SEGL()*f,done:false})),mgT:0,rfT:0,shT:0,gasZones:[],smoke:used.smk?4+used.smk*4:0,snipers:used.snp,tank:null,melee:false,e:Math.max(0,Math.round(cur.gr)),e0:Math.max(0,Math.round(cur.gr)),mel:[],mT:0.3,supp:0,front:0,pinned:0,eKilled:0,meleeDead:0,sniperDone:false,over:false};
  // gas zones
  for(let i=0;i<Math.round(cur.gs);i++)battle.gasZones.push({x:bx+SEGL()*(0.25+0.5*Math.random()),w:120+Math.random()*80});
  if(used.smk){for(let i=0;i<30+used.smk*20;i++)puff(bx+SEGL()*(0.3+Math.random()*0.5),0.1+Math.random()*0.9,0,1,"smokeW",20,9,90,2);}
  if(used.tnk){battle.tanks=[];for(let i=0;i<used.tnk;i++)battle.tanks.push({x:bx-60-i*140,z:[0.62,0.3,0.8][i%3],hp:1});battle.tank=battle.tanks[0];}
  // MONTAGE: close-up officer whistle, then bugle, then wide
  montage={t:0,dur:4.2,seed:Math.random()*100}; SFX.play("heart",0.7,{fixed:1,dur:4}); SFX.play("clock",0.6,{fixed:1,delay:1.1,dur:1}); SFX.play("bolt",0.5,{delay:0.6});
  setTimeout(()=>AU.whistle(),2150); setTimeout(()=>{SFX.play("mud",0.5,{dur:0.8});},3150); setTimeout(()=>{AU.cheer();AU.bugle();},3900);
  cam.tx=bx+80; cam.tz=sendN>44?0.9:1.1; cam.tt=0.3;
  { const zh=S.lang==="zh", n=sendN; const cap= n<15?(zh?"一个班翻出战壕":"A section goes over"): n<40?(zh?"一个排翻出战壕":"A platoon goes over"): n<120?(zh?"整个连翻出战壕":"The whole company goes over"):(zh?"整个营翻出战壕":"The battalion goes over");
    setTimeout(()=>{ big(cap, waves.length>1?(zh?`${waves.length} 个波次`:`${waves.length} waves`):"",1800); },4300); }
  // BUFFER ZONE: from level 5 our own trench gives covering fire first (free damage)
  if(S.lvl>=4){ const cov=Math.max(1,Math.round(battle.e*0.08)); setTimeout(()=>{ let k=cov; for(let i=0;i<14;i++)setTimeout(()=>{AU.shot(0.2);const e=pick(enemies.filter(x=>x.alive));if(e)tracer(bx+10,0.5+Math.random()*0.4,40,e.x,e.z,40);},i*120);
      battle.e=Math.max(1,battle.e-cov); battle.eKilled+=cov; cur.gr=battle.e; cur.rf*=0.85; toast((S.lang==="zh"?"掩护射击：守军 −":"Covering fire: garrison −")+cov); },4400); }
  $("hud").classList.remove("hide");

function killMan(m,cause){
  if(!m.alive)return; if(Math.random()<0.1)AU.scream&&AU.scream(); if(Math.random()<0.3)AU.fall&&AU.fall(); if(battle)shockNear(m.x,m.z); m.alive=false; battle&&battle.dead++;
  const rr=Math.random(); if(cause==="mg"||cause==="rf"){ const imp2 = rr<0.35?[1.5+Math.random()*2,1]: rr<0.7?[-4-Math.random()*5,3+Math.random()*5]:[-(1+Math.random()*2),7+Math.random()*4];
    makeRagdoll(m.x,m.z,m.dir,manCols(m),m.vet,imp2,false); puff(m.x,m.z,40,5,"blood",60,0.5,2,-400); if(Math.random()<0.06)say(m,pick(L_().deathcries)); return; }
  const imp = cause==="mine"?[ (Math.random()-0.3)*14, 22+Math.random()*10 ] : cause==="shell"?[(Math.random()-0.5)*16,18+Math.random()*8]: [ -3-Math.random()*4, 2+Math.random()*4 ];
  makeRagdoll(m.x,m.z,m.dir,manCols(m),m.vet,imp,false);
  puff(m.x,m.z,40,4,"blood",60,0.5,2,-400);
  if(Math.random()<0.06)say(m,pick(L_().deathcries));
}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function say(m,txt,dur=1.8){bubbles.push({x:m.x,z:m.z,h:80,text:txt,t:0,dur,follow:m});}

function stepBattle(dt){
  const b=battle; if(!b||b.over)return; b.t+=dt;
  const alive=men.filter(m=>m.alive); const bx=trenchX(S.lvl), ex=trenchX(S.lvl+1);
  const running=alive.filter(m=>m.state==="run");
  // advance soldiers
  for(const m of alive){
    if(m.state==="climb"){ m.lift=Math.min(1,(m.lift||0)+dt*1.7); m.phase+=dt*8; m.x+=dt*TR_W*1.6; if(m.lift>=1){m.state="run";m.intrench=false;} continue; }
    if(m.state==="crouch"){ m.delay-=dt; if(m.delay<=0&&!montage){m.state="climb";m.lift=0; if(Math.random()<0.1)SFX.play("mud",0.3,{gap:0.1,dur:0.5}); if(Math.random()<0.05)say(m,S.lang==="zh"?"冲啊！":"Go! Go!",1.2);} continue; }
    if(m.state==="run"){
      let sp=m.speed; for(const g of b.gasZones)if(Math.abs(m.x-g.x)<g.w)sp*=0.8;
      if(cur.wr>0&&m.x>bx+SEGL()*0.55&&m.x<bx+SEGL()*0.62)sp*=Math.max(0.3,1-cur.wr*0.22);
      if(m.hold>0){m.hold-=dt;sp*=0.08;}
      if(m.stumble>0){m.stumble-=dt;sp*=0.05;} else if(Math.random()<dt*0.04){m.stumble=0.35+Math.random()*0.4; if(Math.random()<0.3)say(m,pick(S.lang==="zh"?["起来！","继续跑！","别停！"]:["Up!","Keep going!","Don't stop!"]),1);}
      m.x+=sp*dt; m.phase+=dt*sp*0.075*(m.v?m.v.gaitF:1);
      if(m.x>=ex-150-((m.z*977)%1)*40){b.reached++; if(b.e>0&&b.assault){m.state="melee";m.x=ex-40+Math.random()*50+b.front; joinMelee(m);} else if(b.e>0){m.state="gather";m.gx=m.x; if(!b.gatherMsg){b.gatherMsg=1;toast(S.lang==="zh"?"先头部队在铁丝网前隐蔽，等待后续部队…":"Leading men take cover at the wire, waiting for the rest…");}} else {m.state="wait";}}
      // morale: low morale men go to ground (pinned = lost)
      if(m.mor<22&&Math.random()<dt*1.6){ pinMan(m); continue; }
      // mines
      for(const mn of mines){ if(mn.live&&Math.abs(mn.x-m.x)<14&&Math.abs(mn.z-m.z)<0.07){ mn.live=false; explosion(mn.x,mn.z,0.9);
         for(const o of alive){ if(o.alive&&Math.abs(o.x-mn.x)<45&&Math.abs(o.z-mn.z)<0.12&&(o===m||Math.random()<0.6)) killMan(o,"mine"); } } }
      // gas slow kill
      for(const g of b.gasZones){ if(Math.abs(m.x-g.x)<g.w&&Math.random()<0.012*dt*60*0.12)killMan(m,"gas"); }
    }
  }
  // hazards: continuous fire on running men
  const supp=1-(b.supp||0); const smokeF = (b.smoke>0 ? 0.45 : 1)*supp; if(b.smoke>0)b.smoke-=dt;
  const tankF = b.tanks ? Math.max(0.5,1-0.2*b.tanks.length) : 1;
  if(running.length){
    // machine guns
    const mgRate=cur.mg*0.028*smokeF*tankF*(1500/SEGL())/mf(); // per soldier per second
    b.mgT-=dt; if(cur.mg>0.05&&b.mgT<=0){ b.mgT=0.09; AU.mg(1,0.12+Math.min(0.2,cur.mg*0.03));
      const tgt=pick(running); const nest=enemies[Math.floor(Math.random()*enemies.length)]||{x:ex,z:0.5};
      tracer(ex+8,nest.z,40,tgt.x+(Math.random()-0.5)*30,tgt.z,20+Math.random()*40); if(nest)nest.flash=0.06; }
    for(const m of running){ if(m.alive&&Math.random()<mgRate*dt*hitK(m,bx)) killMan(m,"mg"); }
    // rifles
    const rfRate=cur.rf*0.0065*smokeF*(1500/SEGL())/mf();
    b.rfT-=dt; if(cur.rf>0.05&&b.rfT<=0){b.rfT=0.5/Math.max(0.3,cur.rf)*2; AU.shot(0.15); const e=pick(enemies.filter(e=>e.alive))||null; if(e){e.flash=0.08;const tgt=pick(running);tracer(e.x,e.z,48,tgt.x,tgt.z,40);}}
    for(const m of running){ if(m.alive&&Math.random()<rfRate*dt*hitK(m,bx)) killMan(m,"rf"); }
    // enemy shelling
    if(cur.sh>0.05){ b.shT-=dt; if(b.shT<=0){ b.shT=(3.2/cur.sh)*(0.6+Math.random()*0.8); const tg=pick(running); const sx=tg.x+(Math.random()-0.5)*120, sz=Math.max(0.05,Math.min(1,tg.z+(Math.random()-0.5)*0.2));
       shell(sx,sz,1.3,()=>{ for(const o of men){ if(o.alive&&o.state==="run"&&Math.abs(o.x-sx)<55&&Math.abs(o.z-sz)<0.14&&Math.random()<0.75*(FORM[o.form||1].fire>1?1.2:1))killMan(o,"shell"); } },true); } }
  }
  // gas visuals
  if(Math.random()<0.5)for(const g of b.gasZones)puff(g.x+(Math.random()-0.5)*g.w*2,Math.random(),0,1,"gas",15,4,70,3);
  // tank
  if(b.tanks)for(const tk of b.tanks){ if(tk.x<ex-120)tk.x+=48*dt; if(Math.random()<dt*0.8){AU.shot(0.3);explosion(ex+20,0.2+Math.random()*0.7,0.8);cur.mg=Math.max(0,cur.mg-0.15);cur.rf=Math.max(0,cur.rf-0.1);} }
  // node events (stepwise resolution with split-screen)
  const lead=running.length?Math.max(...running.map(m=>m.x)):0;
  for(let ni=0;ni<b.nodes.length;ni++){ const nd=b.nodes[ni]; if(!nd.done&&lead>=nd.x){ nd.done=true; nodeEvent(ni); } }
  // gather in dead ground at the wire, then assault together
  if(!b.assault&&b.e>0){ const gat=alive.filter(m=>m.state==="gather"); const run=alive.filter(m=>m.state==="run"||m.state==="climb"||m.state==="crouch").length;
    if(gat.length&&(run===0||gat.length>=Math.max(4,0.75*(gat.length+run))||gat.length>=b.e*2.5)){ b.assault=true; big(S.lang==="zh"?"冲进战壕！":"INTO THEIR TRENCH!","",1200); AU.whistle(); AU.cheer();
      gat.forEach((m,i)=>{ m.state="melee"; m.x=ex-40+Math.random()*50+b.front; setTimeout(()=>{},0); joinMelee(m); }); } }
  // continuous melee at the enemy line
  if(b.mel.length&&b.e>0){ b.mT-=dt; if(b.mT<=0){ b.mT=0.7; meleeTick(); } }
  // end conditions
  const stillMoving=men.filter(m=>m.alive&&(m.state==="run"||m.state==="crouch"||m.state==="climb"||m.state==="gather")).length;
  const inMelee=b.mel.filter(m=>m.alive).length;
  if(b.e<=0&&!b.over){ b.over=true; men.forEach(m=>{if(m.alive&&m.state==="run"){m.state="wait";}}); setTimeout(()=>result(true),900); }
  else if(men.filter(m=>m.alive).length===0&&!b.over){ b.over=true; setTimeout(()=>result(false),1600); }
  else if(stillMoving===0&&inMelee===0&&b.e>0&&!b.over){ b.over=true; setTimeout(()=>result(false),1600); }
  // camera follows the mass
  if(b.mel.length&&(!running.length||b.mel.length>running.length*0.6)){cam.tx=ex-80+b.front; cam.tz=1.15;} else if(running.length){ const avg=running.reduce((s,m)=>s+m.x,0)/running.length; cam.tx=Math.min(ex-200,Math.max(bx+100,avg+160)); }
  // HUD
  $("hud").innerHTML=`<span>${IC.man.replace('<svg','<svg width=22 height=22 style="vertical-align:-3px"')} ${alive.length}</span><span style="color:#c8432f">${IC.skull.replace('<svg','<svg width=22 height=22 style="vertical-align:-3px"')} ${b.dead}</span><span>${IC.gr.replace('<svg','<svg width=22 height=22 style="vertical-align:-3px"')} ${Math.max(0,Math.round(b.e))}</span>${b.pinned?`<span style="color:#d8b060">⬇ ${b.pinned}</span>`:""}`;
}

function trenchLines(i){ return i<0?1:Math.min(4,1+Math.floor((i+1)/4)); }
function hitK(m,bx){ const p=Math.max(0,Math.min(1,(m.x-bx)/SEGL())); return (0.45+1.45*Math.pow(p,1.6))*FORM[m.form||1].fire*(m.vet?0.62:1); }
function pinMan(m){ if(!m.alive)return; m.alive=false; m.pinned=true; m.state="prone"; battle.pinned++; if(Math.random()<0.3)say(m,pick(S.lang==="zh"?["我不行了…","趴下！","妈妈…"]:["I can't…","Get down!","Mother…"]),1.4); }
function shockNear(x,z){ for(const o of men){ if(o.alive&&o.state==="run"&&Math.abs(o.x-x)<70&&Math.abs(o.z-z)<0.16){ o.mor-= (o.vet?2:5.5)*(0.6+Math.random()*0.8)*(FORM[o.form||1].melee>1?0.8:1); } } }
function joinMelee(m){ const b=battle; b.mel.push(m); m.phase=Math.random()*6; if(!b.melee){ b.melee=true; big(L_().melee,"",1100); AU.cheer(); cam.shake=6; slowmo=0.55; setTimeout(()=>slowmo=1,900); } if(Math.random()<0.12)say(m,pick(S.lang==="zh"?["刺刀！","杀！","冲进去！"]:["Bayonets!","At them!","Into the trench!"]),1.1); }
function meleeTick(){
  const b=battle, ex=trenchX(S.lvl+1); const al=b.mel.filter(m=>m.alive); if(!al.length)return;
  let A=0,coh=0; for(const m of al){A+=m.vet?1.55:1; coh+=FORM[m.form||1].melee;} coh/=al.length; A*=coh*mf();
  const E=b.e*(lvl.fort?1.25:1)*(1+0.08*Math.min(3,lvl.ch));
  const ratio=A/Math.max(0.5,E); // Lanchester: numbers compound
  const kOur=0.13*A*Math.min(2.4,Math.sqrt(ratio)), kEn=0.13*E*Math.min(2.4,Math.sqrt(1/ratio));
  const rnd=x=>Math.floor(x)+(Math.random()<x-Math.floor(x)?1:0);
  let k=Math.min(b.e,rnd(kOur*(0.7+Math.random()*0.6))), kk=Math.min(al.length,rnd(kEn*(0.7+Math.random()*0.6)));
  b.e-=k; b.eKilled+=k; cur.gr=b.e; b.supp=Math.min(0.9,A/(A+E)*1.15);
  const FD=(trenchLines(S.lvl)-1)*85+40; b.front=Math.min(FD,(1-b.e/Math.max(1,b.e0))*FD); // fight moves deeper into the trench system
  let ve=enemies.filter(x=>x.alive); for(let i=0;i<Math.min(k,ve.length);i++){ const en=ve[Math.floor(Math.random()*ve.length)]; if(en.alive){en.alive=false;makeRagdoll(en.x,en.z,-1,pal.en,false,[8+Math.random()*6,6+Math.random()*6],true);puff(en.x,en.z,40,4,"blood",60,0.5,2,-400);} }
  ve=enemies.filter(x=>x.alive); while(ve.length<Math.min(b.e,24)){const n={x:ex+b.front+Math.random()*50,z:laneZ(Math.random()),phase:0,alive:true,flash:0};enemies.push(n);ve.push(n);}
  enemies.forEach(en=>{if(en.alive&&en.x<ex+b.front-10)en.x+=6;});
  al.sort(()=>Math.random()-0.5); for(let i=0;i<kk;i++){ const m=al[i]; m.alive=false; b.dead++; b.meleeDead++; makeRagdoll(m.x,m.z,1,manCols(m),m.vet,[-6-Math.random()*6,6+Math.random()*6],false); }
  al.forEach(m=>{ if(m.alive&&m.x<ex-30+b.front)m.x+=8+Math.random()*10; });
  for(let i=0;i<Math.min(6,2+k);i++)setTimeout(()=>AU.clang(),i*70); if(Math.random()<0.6)AU.shot(0.25);
  for(let i=0;i<Math.min(8,k+kk);i++){const x=ex+b.front-20+Math.random()*60;puff(x,laneZ(Math.random()),45,3,"spark",80,0.25,2,-200);}
  cam.shake=Math.max(cam.shake,2+Math.min(8,k)); if(k>=5&&Math.random()<0.5){slowmo=0.5;setTimeout(()=>slowmo=1,350);}
  if(ratio>2.5&&Math.random()<0.2)toast(S.lang==="zh"?"敌军被压倒！":"The enemy is overwhelmed!");
}
function nodeEvent(ni){
  const b=battle; const running=men.filter(m=>m.alive&&m.state==="run");
  // pick featured hazard for this node
  const opts=[]; if(cur.mg>0.3)opts.push("mg"); if(cur.rf>0.5)opts.push("rf"); if(cur.sh>0.3)opts.push("sh");
  if(!opts.length)return;
  const kind= ni===0&&cur.mg>0.3 ? "mg" : pick(opts);
  const counter = kind==="mg" && b.snipers>0;
  insets.push({kind,t:0,dur:counter?3.2:2.2,side:"right",counter});
  // casualties burst (stepwise)
  const pct = kind==="mg"? Math.min(0.5,cur.mg*0.045) : kind==="rf"? Math.min(0.3,cur.rf*0.018) : Math.min(0.35,cur.sh*0.05);
  const n = counter? Math.round(running.length*pct*0.3) : Math.round(running.length*pct);
  running.sort(()=>Math.random()-0.5);
  for(let i=0;i<n;i++){ const m=running[i]; setTimeout(()=>{ if(m.alive){ if(kind==="mg"){const e=enemies[0]||{z:.5};tracer(trenchX(S.lvl+1),e.z,40,m.x,m.z,30);} killMan(m,kind==="sh"?"shell":"mg"); if(kind==="mg"&&i%3==0)AU.mg(2,0.2);} }, 200+i*(1100/Math.max(1,n))); }
  if(kind==="sh"){ for(let i=0;i<3;i++)setTimeout(()=>{const tg=pick(running);if(tg)explosion(tg.x,tg.z,1.2);},i*300); }
  if(counter){ b.snipers--; insets.push({kind:"snp",t:0,dur:3.2,side:"left"});
    setTimeout(()=>{ AU.shot(0.6); cur.mg=Math.max(0,cur.mg-1.5); toast(`${IC.snp.replace('<svg','<svg width=18 height=18 style="vertical-align:middle"')} ${IC.mg.replace('<svg','<svg width=18 height=18 style="vertical-align:middle"')} ✕`); },1500); }
}

/* ---------- MELEE ---------- */
function startMelee(){
  const b=battle; mode="melee"; const ex=trenchX(S.lvl+1);
  const alive=men.filter(m=>m.alive);
  big(L_().melee,"",1100); AU.cheer();
  cam.tx=ex-20; cam.tz=1.35; cam.tt=0.35;
  let e=Math.max(0,Math.round(cur.gr));
  // make visible enemies pop out
  enemies.forEach(en=>{if(en.alive){en.x=ex+Math.random()*40;}});
  alive.forEach(m=>{m.state="melee";m.x=ex-30+Math.random()*60;});
  let round=0;
  const tick=()=>{
    const al=men.filter(m=>m.alive); if(!al.length||e<=0){ b.over=true; setTimeout(()=>result(e<=0&&al.length>0),900); return; }
    round++;
    let k=0; al.forEach(m=>{ if(Math.random()<(m.vet?0.62:0.42)*mf()) k++; });
    let kk=0; for(let i=0;i<e;i++) if(Math.random()<0.4) kk++;
    k=Math.min(k,e); e-=k; cur.gr=e;
    // visuals: kill enemies
    let ve=enemies.filter(x=>x.alive); for(let i=0;i<Math.min(k,ve.length);i++){ const en=ve[Math.floor(Math.random()*ve.length)]; if(en.alive){en.alive=false;makeRagdoll(en.x,en.z,-1,pal.en,false,[8+Math.random()*6,6+Math.random()*6],true);} }
    // replenish visible enemies if garrison larger than visible
    ve=enemies.filter(x=>x.alive); while(ve.length<Math.min(e,20)){const n={x:ex+20+Math.random()*30,z:laneZ(Math.random()),phase:0,alive:true,flash:0};enemies.push(n);ve.push(n);}
    al.sort(()=>Math.random()-0.5); for(let i=0;i<Math.min(kk,al.length);i++){ const m=al[i]; m.alive=false; battle.dead++; makeRagdoll(m.x,m.z,1,m.vet?pal.vet:pal.us,m.vet,[-6-Math.random()*6,6+Math.random()*6],false); }
    for(let i=0;i<4;i++)setTimeout(()=>AU.clang(),i*90); AU.shot(0.3);
    stepBattle(0);
    setTimeout(tick, 520);
  };
  setTimeout(tick,800);
}

function reportHTML(b,surv,vetGain,hold,rear,fail){
  const zh=S.lang==="zh"; const lw=S.lastWaves||[]; const fl=zh?["散兵线","横队","密集"]:["loose","line","dense"];
  const row=(k,v,c="")=>`<tr><td>${k}</td><td class="${c}">${v}</td></tr>`;
  let rem; const eff=b.sent/Math.max(1,b.e0);
  if(fail){ rem = b.pinned>b.sent*0.25 ? (zh?"士气崩溃：大批士兵趴在弹坑里不肯起来。提升士气或派老兵带队。":"Morale broke: many went to ground and would not rise. Raise morale or lead with veterans.")
           : b.meleeDead>b.dead*0.4 ? (zh?"白刃战失利：到达的人太少或太分散。把波次间隔缩短、队形收紧。":"Lost at the bayonet: too few arrived, or too spread out. Shorten wave delays, tighten formation.")
           : (zh?"在无人区被火力消灭。用更散的队形、烟幕和炮击压制。":"Cut down in no man's land. Loosen formation, use smoke and artillery.");}
  else if(rear>b.e0*1.5) rem = zh?`兵力过剩：${rear} 人被调往后方，对这个阵地毫无用处。下次少派一些。`:`Overcommitted: ${rear} men were sent to the rear — surplus to this attack. Send fewer next time.`;
  else if(b.dead>b.sent*0.7) rem = zh?"惨胜：代价极高。考虑更多火力支援或分波次进攻。":"Pyrrhic: the price was terrible. Consider more support or more waves.";
  else if(eff<3&&b.dead<b.sent*0.5) rem = zh?"高效：兵力恰到好处。参谋部很满意。":"Efficient: just enough men. Staff is pleased.";
  else rem = zh?"合格：阵地拿下，损失可以接受。":"Sound: the line is taken at an acceptable cost.";
  return `<div class="rep"><table>${row(zh?"派出":"Sent",`${b.sent} <small>(${lw.map((w,i)=>`W${i+1}:${w.r}${w.v?"+★"+w.v:""} ${fl[w.f]}`).join(" · ")})</small>`)}
   ${row(zh?"阵亡":"Killed",b.dead,"red")}${row(zh?"趴下不起 (计为损失)":"Went to ground (lost)",b.pinned,"red")}
   ${row(zh?"击毙守军":"Enemy killed",b.eKilled)}
   ${fail?"":row(zh?"幸存":"Survived",surv)+row(zh?"留守新阵地":"Hold the new trench",hold)+row(zh?"调往后方":"Transferred to the rear",rear, rear>b.e0?"red":"")+row(zh?"晋升老兵 返回":"Return as veterans",vetGain,"gold")}
   </table><div class="rem">📝 ${rem}</div></div>`;
}

  if(win){
    CG.happy();
    const vetGain=surv>0?Math.max(1,Math.floor(surv*0.25)):0; const need=Math.max(1,Math.ceil(b.e0*0.6)); const hold=Math.min(surv-vetGain,need); const rear=surv-vetGain-hold;
    S.vets+=vetGain; S.reserve+=vetGain;
    S.hist.push({lvl:S.lvl,day:S.day,lost:b.dead,sent:b.sent});
    S.income+=lvl.reward;
    const done=S.lvl;
    S.lvl++; if(S.lvl>=NLV){S.done=true;S.lvl=NLV-1;S.endMs=Date.now()-S.start;}

    flagRaise={x:trenchX(done+1),t:0};
    victoryBanner(t.win,t.winS,LV[done][0]);
    startVictoryFX(trenchX(done+1), surv);
    cam.tt=0.9; cam.tz=0.75;
    for(let i=0;i<Math.min(5,surv);i++)setTimeout(()=>{const m=pick(men.filter(x=>x.alive));if(m)say(m,pick(t.winCries));},300+i*500);

      const ov=$("ov");ov.classList.remove("hide");

          <div class="tile"><b class="cu" data-v="${vetGain}" data-p="+">0</b><span>${t.winVet}</span></div>
          <div class="tile"><b class="cu" data-v="${S.lastMoraleD}" data-p="+">0</b><span>${t.morale}</span><i>${Math.round(S.morale)} · ${moraleWord()}</i></div>
          <div class="tile"><b class="cu" data-v="${hold}">0</b><span>${t.winHold}</span></div>
          <div class="tile dark"><b class="cu" data-v="${b.dead}">0</b><span>${t.winLost}</span></div></div>
        ${reportHTML(b,surv,vetGain,hold,rear)}
        <div style="font-size:13px;opacity:.7">${S.done?"":t.nextObj+": <b>"+LV[S.lvl][0]+"</b>"}</div>
        <button class="btn" id="okr">▶</button></div>`;
      countUp(); ov.querySelector(".card").classList.add("vcard"); CG.banner(true); // [AD SPOT C]
      $("okr").onclick=()=>{AU.click();CG.banner(false);CG.midgame(()=>{ if(S.done)showEnd(); else advanceCamp(); });}; // [AD SPOT B]
    },3200);
  } else {
    (S.fails=S.fails||{})[S.lvl]=(S.fails[S.lvl]||[]).concat([{day:S.day,w:S.lastWaves||[],dead:b.dead,pin:b.pinned,e:Math.round(b.e)}]).slice(-8);

      const ov=$("ov");ov.classList.remove("hide");
      ov.innerHTML=`<div class="card"><h2 class="stencil">${t.fail}</h2><div style="font-size:16px;line-height:1.9">${IC.skull.replace('<svg','<svg width=18 height=18 style="vertical-align:-3px"')} <b>${b.dead}</b> ${t.winLost} · ${IC.gr.replace('<svg','<svg width=18 height=18 style="vertical-align:-3px"')} <b>${Math.round(cur.gr)}</b> ${t.hz.gr}</div>${reportHTML(b,0,0,0,0,true)}

      CG.banner(true);

    },2600);
  }

/* WEATHER per chapter: 0 summer haze+pollen, 1 rain, 2 snow, 3 fog, 4 dusk embers */
const wx=[]; let wxKind=-1;
function stepWeather(dt){ const k=Math.min(4,Math.floor(S.lvl/8)); if(k!==wxKind){wxKind=k;wx.length=0;}
  const N=k===1?220:k===2?160:k===4?40:k===0?25:0;

  for(const p of wx){ if(k===1){p.y+=900*p.v*dt;p.x-=180*dt;} else if(k===2){p.y+=60*p.v*dt;p.x+=Math.sin(time+p.r*9)*20*dt-15*dt;} else if(k===4){p.y-=30*p.v*dt;p.x+=10*dt;} else {p.y+=8*dt;p.x+=12*p.v*dt;}
    if(p.y>H+10){p.y=-10;p.x=Math.random()*W*1.2;} if(p.y<-10){p.y=H+5;} if(p.x<-20)p.x=W+10; if(p.x>W+20)p.x=-10; } }
function drawWeather(){ const k=wxKind; if(k===1){ cx.strokeStyle="rgba(200,210,220,0.28)"; cx.lineWidth=1; cx.beginPath(); for(const p of wx){cx.moveTo(p.x,p.y);cx.lineTo(p.x-5*p.v,p.y+22*p.v);} cx.stroke(); cx.fillStyle="rgba(60,70,80,0.12)"; cx.fillRect(0,0,W,H); }

  else if(k===4){ for(const p of wx){cx.fillStyle=`rgba(255,${150+p.r*80|0},60,${0.5+0.4*Math.sin(time*4+p.r*9)})`;cx.fillRect(p.x,p.y,2,2);} }
  else if(k===0){ cx.fillStyle="rgba(255,245,200,0.5)"; for(const p of wx){cx.fillRect(p.x,p.y,1.5,1.5);} } }
function drawForeground(){
  const par=1.6, z=1.25; const s=scaleZ(z)*1.4;
  const baseY=H+10;
  cx.fillStyle="rgba(18,14,10,0.92)";
  const step=700; const k0=Math.floor((cam.x*par - W)/step)-1;
  for(let k=k0;k<k0+Math.ceil(W*2/step)+3;k++){
    const r=hash(k*97+5); const x=k*step - cam.x*par + W/2;

      cx.strokeStyle="rgba(18,14,10,0.9)";cx.lineWidth=1.3;cx.beginPath();

    } else if(r>-0.4){ // grass clump
